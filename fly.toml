# Fly.io config for the acta Go API → api.rithvikronaldo.dev
# Frontend deploys to Vercel separately (acta.rithvikronaldo.dev).
#
# Deploy:
#   fly launch --no-deploy        # first time: creates the app from this file
#   fly secrets set DB_URL="postgres://<user>:<pw>@<neon-host>/acta?sslmode=require"
#   fly deploy
#   fly certs add api.rithvikronaldo.dev
app = "acta-api"
primary_region = "iad"  # us-east; pick the region nearest your Neon DB

[build]
  dockerfile = "Dockerfile.api"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Always-on so the live demo never cold-starts (the reason we chose Fly over
  # Render's free tier). One small machine is plenty for the demo.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
