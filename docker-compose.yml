services:
  postgres:
    image: postgres:16-alpine
    container_name: acta-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: acta
    ports:
      - "5433:5432"
    volumes:
      - acta_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d acta"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  acta_pgdata:
